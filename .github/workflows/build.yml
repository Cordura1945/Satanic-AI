name: Alle bauen
on:
  push:
  workflow_dispatch:
env:
  APP_NAME: Satanic-AI
jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Chat-Server und Setup-Skript pruefen
      run: python3 tools/build_setup.py --check
  vorbereiten:
    needs: pruefen
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Release fuer diesen Build neu anlegen
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        TAG="latest-${GITHUB_REF_NAME//\//-}"
        gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true
        gh release create "$TAG" --target "$GITHUB_SHA" \
          --title "$APP_NAME ($GITHUB_REF_NAME) - Build #$GITHUB_RUN_NUMBER" \
          --notes "Automatisch gebaut aus $GITHUB_SHA (Branch $GITHUB_REF_NAME, Run $GITHUB_RUN_ID)."
  iphone:
    needs: vorbereiten
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Icon und Logo einbinden
      run: 'mkdir -p Assets.xcassets/AppIcon.appiconset Assets.xcassets/Logo.imageset

        cp icon.png Assets.xcassets/AppIcon.appiconset/icon.png

        cp logo.png Assets.xcassets/Logo.imageset/logo.png

        mkdir -p Assets.xcassets/Background.imageset

        cp bg.jpg Assets.xcassets/Background.imageset/bg.jpg

        echo ''{"images":[{"filename":"bg.jpg","idiom":"universal"}],"info":{"author":"xcode","version":1}}'' > Assets.xcassets/Background.imageset/Contents.json

        echo ''{"info":{"author":"xcode","version":1}}'' > Assets.xcassets/Contents.json

        echo ''{"images":[{"filename":"icon.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}'' > Assets.xcassets/AppIcon.appiconset/Contents.json

        echo ''{"images":[{"filename":"logo.png","idiom":"universal"}],"info":{"author":"xcode","version":1}}'' > Assets.xcassets/Logo.imageset/Contents.json

        '
    - name: Setup-Skript zusammenbauen
      shell: bash
      run: python3 tools/build_setup.py || python tools/build_setup.py
    - name: Setup-Skript komprimieren
      run: gzip -9 -n -c setup_all.sh > setup_all.sh.gz
    - name: XcodeGen installieren
      run: brew install xcodegen
    - name: Projekt erzeugen
      run: xcodegen generate
    - name: Bauen (ohne Signatur)
      run: "xcodebuild -project KIStart.xcodeproj -scheme KIStart -configuration Release \\\n  -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \\\n  CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=\"\" build\n"
    - name: IPA packen
      run: 'mkdir Payload

        cp -R build/Build/Products/Release-iphoneos/KIStart.app Payload/

        zip -r "$APP_NAME.ipa" Payload

        '
    - name: Paket schnueren
      run: |
        mkdir out
        cp "$APP_NAME.ipa" out/
        cp Anleitung*.txt out/ || true
    - name: Ins Release hochladen
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: gh release upload "latest-${GITHUB_REF_NAME//\//-}" "out/$APP_NAME.ipa" --clobber
  android:
    needs: vorbereiten
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21
    - name: Setup-Skript zusammenbauen
      shell: bash
      run: python3 tools/build_setup.py || python tools/build_setup.py
    - name: Web-Dateien zusammenstellen
      run: 'mkdir www

        cp app.html www/index.html

        cp bg.jpg splash.mp4 devzone.mp4 devzone_wide.mp4 www/

        echo "window.SETUP_B64=''$(gzip -9 -n -c setup_all.sh | base64 -w0)''" > www/setup.js

        '
    - run: npm install
    - name: Capacitor-Konfiguration schreiben
      run: "cat > capacitor.config.json <<'CFG'\n{\n  \"appId\": \"com.kistart.app\",\n  \"appName\": \"Satanic\",\n  \"webDir\": \"www\",\n  \"backgroundColor\": \"#000000\",\n  \"plugins\": { \"CapacitorHttp\": { \"enabled\": true } }\n}\nCFG\ncat capacitor.config.json\n"
    - run: npx cap add android
    - name: App-Icon erzeugen
      continue-on-error: true
      run: 'mkdir -p assets

        cp icon.png assets/icon-only.png

        npx --yes @capacitor/assets generate --android --iconBackgroundColor ''#000000'' --iconBackgroundColorDark ''#000000'' --splashBackgroundColor ''#000000'' --splashBackgroundColorDark ''#000000''

        '
    - run: npx cap sync android
    - name: APK bauen
      working-directory: android
      run: ./gradlew assembleDebug --no-daemon || (sleep 30 && ./gradlew assembleDebug --no-daemon --refresh-dependencies)
    - name: APK umbenennen
      run: |
        mkdir out
        cp android/app/build/outputs/apk/debug/app-debug.apk "out/$APP_NAME.apk"
        cp Anleitung*.txt out/ || true
    - name: Ins Release hochladen
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: gh release upload "latest-${GITHUB_REF_NAME//\//-}" "out/$APP_NAME.apk" --clobber
  windows:
    needs: vorbereiten
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Setup-Skript zusammenbauen
      shell: bash
      run: python3 tools/build_setup.py || python tools/build_setup.py
    - name: Web-Dateien zusammenstellen
      shell: bash
      run: 'mkdir www

        cp app.html www/index.html

        cp bg.jpg splash.mp4 devzone.mp4 devzone_wide.mp4 www/

        echo "window.SETUP_B64=''$(gzip -9 -n -c setup_all.sh | base64 -w0)''" > www/setup.js

        '
    - run: npm install
    - run: npx electron-builder --win portable --publish never
    - name: EXE umbenennen
      shell: bash
      run: |
        mkdir out
        cp dist/KI-Start.exe "out/$APP_NAME.exe"
        cp Anleitung*.txt out/ || true
    - name: Ins Release hochladen
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: gh release upload "latest-${GITHUB_REF_NAME//\//-}" "out/$APP_NAME.exe" --clobber
