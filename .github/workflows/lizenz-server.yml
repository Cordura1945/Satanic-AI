name: Lizenz-Server
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
    - 'license/**'
    - '.github/workflows/lizenz-server.yml'
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ADMIN_PW: ${{ secrets.LICENSE_ADMIN_PW }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Lizenz-Server testen
      run: node tools/license_test.mjs
    - name: Zugangsdaten pruefen
      id: chk
      shell: bash
      run: |
        if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$ADMIN_PW" ]; then
          echo "::warning::Nicht uebertragen: Es fehlen die GitHub-Secrets CLOUDFLARE_API_TOKEN und LICENSE_ADMIN_PW (Settings > Secrets and variables > Actions)."
          echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
        fi
        if [ ${#ADMIN_PW} -lt 12 ]; then echo "::error::LICENSE_ADMIN_PW muss mindestens 12 Zeichen haben."; exit 1; fi
        echo "ready=true" >> "$GITHUB_OUTPUT"
    - name: Zu Cloudflare uebertragen
      if: steps.chk.outputs.ready == 'true'
      shell: bash
      working-directory: license
      run: |
        npx --yes wrangler@4 deploy 2>&1 | tee deploy.log
        URL=$(grep -o 'https://[a-zA-Z0-9.-]*workers\.dev' deploy.log | head -1)
        echo "URL=$URL" >> "$GITHUB_ENV"
    - name: Admin-Passwort setzen
      if: steps.chk.outputs.ready == 'true'
      shell: bash
      working-directory: license
      run: printf '%s' "$ADMIN_PW" | npx --yes wrangler@4 secret put ADMIN_PW
    - name: Ergebnis
      if: steps.chk.outputs.ready == 'true'
      shell: bash
      run: |
        echo "Lizenz-Server: $URL"
        echo "Verwaltung:    $URL/admin"
        curl -s -m 20 "$URL/health" || true
        echo; echo "Setup-Abruf ohne Key (erwartet 400): $(curl -s -m 20 -o /dev/null -w '%{http_code}' "$URL/setup/main")"
        { echo "### Lizenz-Server"; echo "Adresse: $URL"; echo "Verwaltung: $URL/admin"; } >> "$GITHUB_STEP_SUMMARY"
