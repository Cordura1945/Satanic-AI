name: Windows EXE
on:
  workflow_dispatch:
  push:
    paths: ["app.html", "main.js", "package.json", "setup_all.sh", ".github/workflows/windows.yml"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Web-Dateien zusammenstellen
        shell: bash
        run: |
          mkdir www
          cp app.html www/index.html
          cp bg.jpg splash.mp4 www/
          echo "window.SETUP_B64='$(base64 -w0 setup_all.sh)'" > www/setup.js
      - run: npm install
      - run: npx electron-builder --win portable --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: KIStart-exe
          path: dist/KI-Start.exe
