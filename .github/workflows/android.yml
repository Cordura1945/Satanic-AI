name: Android APK
on:
  workflow_dispatch:
  push:
    paths: ["app.html", "capacitor.config.json", "package.json", "setup_all.sh", ".github/workflows/android.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Web-Dateien zusammenstellen
        run: |
          mkdir www
          cp app.html www/index.html
          cp bg.jpg splash.mp4 www/
          echo "window.SETUP_B64='$(base64 -w0 setup_all.sh)'" > www/setup.js
      - run: npm install
      - run: npx cap add android
      - name: App-Icon erzeugen
        continue-on-error: true
        run: |
          mkdir -p assets
          cp icon.png assets/icon-only.png
          npx --yes @capacitor/assets generate --android --iconBackgroundColor '#000000' --iconBackgroundColorDark '#000000' --splashBackgroundColor '#000000' --splashBackgroundColorDark '#000000'
      - run: npx cap sync android
      - name: APK bauen
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: KIStart-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
